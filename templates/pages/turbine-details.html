{{define "turbine-details"}}
<!DOCTYPE html>
<html>
    {{template "head" .}}
    <body>
        {{template "header" .}}
        <main>
            {{with .turbine}}
            <div class="turbine-details">
                <div class="left-column">
                    <img src="{{.ImageSrc}}" alt="Изображение {{.Title}}">
                    <ul>
                        <li>
                            Максимальная мощность: <b>{{.Power}} кВт</b>
                        </li>
                        <li>
                            Высота мачты: <b>{{.Height}} м</b>
                        </li>
                    </ul>
                </div>
                <div class="right-column">
                    <h1>{{.Title}}</h1>
                    <p>{{.Description}}</p>
                </div>
            </div>
            {{end}}
        </main>
    </body>
</html>
{{end}}
